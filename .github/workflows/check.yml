name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv run --with ruff==0.17.3 ruff check src tests examples
      - run: uv run pytest
      - run: uv build
