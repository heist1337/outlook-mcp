[project]
name = "outlook-mcp"
version = "0.2.0"
description = "Outlook mail and calendar MCP for on-premises Exchange EWS"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchangelib>=5.4.0,<6",
    "fastapi>=0.115.0,<1",
    "fastmcp==4.1.4",
    "google-api-python-client>=2.190.0,<3",
    "google-auth>=2.45.0,<3",
    "pydantic-settings>=2.8.0,<3",
    "uvicorn[standard]>=0.34.0,<1",
]

[project.scripts]
outlook-mcp = "exchange_ews_bridge.__main__:main"

[tool.uv.build-backend]
module-name = "exchange_ews_bridge"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.28.0,<1",
    "httpx2>=2.5.0,<3",
    "pytest-asyncio>=1.0,<2",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/exchange_ews_bridge/app.py" = ["B008"]

[tool.ty.environment]
python-version = "3.12"

[build-system]
requires = ["uv_build==0.11.33"]
build-backend = "uv_build"
